# MP284 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G251"          # your group id, e.g. "G042"
problem_id: "MP284"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "delivered_min_from_receipt"           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "distance_km"           # the column recorded in a different unit
    group_value: "Central"      # the value of route_zone whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "rider_age"
    value: -999            # the special number typed instead of a blank
    count: 40            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "wait_at_station_min"
    start_date: "2026-03-29"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-20"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "transport"
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    distance_km: null
    tiffins: null
    handovers: null
    wait_at_station_min: null
    rider_age: null
    temp_c: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of route_zone
    'Central': null
    'Suburb': null
    'Old City': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
